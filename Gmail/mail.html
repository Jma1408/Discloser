<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boîte de réception - alex.morel.reportages@gmail.com</title>
  <link rel="stylesheet" href="mail.css">
</head>
<body>

  <!-- ====== COLONNE GAUCHE ====== -->
  <aside id="sidebar" class="sidebar">
    <!-- Menu hamburger -->
    <button id="btn-hamburger" class="icon-btn hamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <rect x="2" y="4" width="20" height="3.2" rx="1.6" fill="#111"/>
        <rect x="2" y="10.4" width="20" height="3.2" rx="1.6" fill="#111"/>
        <rect x="2" y="16.8" width="20" height="3.2" rx="1.6" fill="#111"/>
      </svg>
    </button>

    <!-- Bouton Compose -->
    <button id="btn-compose" class="compose-btn">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M3 21l1.2-5.1L16.6 3.5a2 2 0 0 1 2.8 0l1.1 1.1a2 2 0 0 1 0 2.8L8.1 19.8 3 21z" fill="#111"/>
        <path d="M14.8 5.3l3.9 3.9" stroke="#7fb6e4" stroke-width="1.4"/>
      </svg>
      <span class="compose-label">Compose</span>
    </button>

    <!-- Entrée Boîte de réception -->
    <div class="inbox-entry">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M3 14l2.6-6.5A2 2 0 0 1 7.5 6H8M21 14l-2.6-6.5A2 2 0 0 0 16.5 6H16" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M3 14h5.2a1.5 1.5 0 0 0 1.5 1.3h4.6A1.5 1.5 0 0 0 15.8 14H21v5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19v-5z" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 2.5l.6 2M12 1.8V4.5M15 2.5l-.6 2" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="inbox-label">Boîte de réception</span>
      <span id="unread-count" class="unread-count">0</span>
    </div>

    <!-- Liste des mails -->
    <div id="mail-list" class="mail-list" role="list"></div>
  </aside>

  <!-- ====== ZONE PRINCIPALE ====== -->
  <main class="main">
    <!-- Barre du haut -->
    <header class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <circle cx="10" cy="10" r="6.5" fill="none" stroke="#111" stroke-width="1.8"/>
          <path d="M15 15l6 6" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="Rechercher un mail" autocomplete="off">
      </div>

      <div class="topbar-actions">
        <!-- Engrenage -->
        <div class="dropdown-wrap">
          <button id="btn-settings" class="icon-btn gear" aria-label="Paramètres">
            <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true">
              <path fill="#111" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.2.4.5.4h3.8c.3 0 .5-.2.5-.4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
              <circle cx="12" cy="12" r="2.4" fill="#333"/>
            </svg>
          </button>
          <div id="menu-settings" class="dropdown" hidden>
            <a href="in-progress.html">Paramètres</a>
            <a href="in-progress.html">Thèmes</a>
            <a href="in-progress.html">Afficher tous les paramètres</a>
          </div>
        </div>

        <!-- Avatar -->
        <div class="dropdown-wrap">
          <button id="btn-avatar" class="avatar-btn" aria-label="Compte">
            <svg viewBox="0 0 24 24" width="54" height="54" aria-hidden="true">
              <circle cx="12" cy="12" r="12" fill="#5aa874"/>
              <circle cx="12" cy="9.2" r="4" fill="none" stroke="#fff" stroke-width="1"/>
              <path d="M4.2 20.2c.9-3.6 4-5.4 7.8-5.4s6.9 1.8 7.8 5.4A11.9 11.9 0 0 1 12 24a11.9 11.9 0 0 1-7.8-3.8z" fill="#fff"/>
            </svg>
          </button>
          <div id="menu-avatar" class="dropdown" hidden>
            <div class="dropdown-user">
              <strong>Alex Morel</strong>
              <span>alex.morel.reportages@gmail.com</span>
            </div>
            <a href="in-progress.html">Gérer votre compte</a>
            <a href="in-progress.html">Se déconnecter</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Panneau de lecture -->
    <section id="reader" class="reader">
      <div id="reader-empty" class="reader-empty">Sélectionnez un mail</div>
      <article id="reader-content" class="reader-content" hidden></article>
    </section>
  </main>

  <!-- ====== FENÊTRE DE RÉDACTION ====== -->
  <div id="compose-window" class="compose-window" hidden>
    <div class="compose-header">
      <span>Nouveau message</span>
      <button id="compose-close" class="compose-close" aria-label="Fermer">×</button>
    </div>
    <input id="compose-to" class="compose-field" type="text" placeholder="À">
    <input id="compose-subject" class="compose-field" type="text" placeholder="Objet">
    <textarea id="compose-body" class="compose-body" placeholder="Rédigez votre message..."></textarea>
    <div id="compose-error" class="compose-error" hidden>Envoi impossible : connexion au serveur interrompue</div>
    <div class="compose-footer">
      <button id="compose-send" class="send-btn">Envoyer</button>
    </div>
  </div>

  <!-- Bouton caché de réinitialisation (tests) -->
  <button id="btn-reset" class="reset-hidden" title="Réinitialiser">reset</button>

  <script src="mail.js"></script>
</body>
</html>
